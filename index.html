nction(x){return x.status==="eligible"}).length+' of '+r.length+'</b><span>programmes eligible, first deadline in '+next[0].days+' days ('+next[0].p.short+')</span></div></aside></section>'+

 return '<h2>AI agent</h2><div class="card"><h3>How the agent works</h3><div>'+chips+'</div><p class="mute">Green stages have run. Booking happens only after your approval.</p><label for="agoal">Goal</label><textarea id="agoal" rows="3" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit">'+esc(S.agoal)+'</textarea><p><button class="btn" id="arun"'+(S.running?' disabled':'')+'>'+(S.running?'Agent is working...':'Run agent')+'</button></p><p class="mute">The agent reads your Documents details, picks its own tools to check each programme, and explains what to fix. It can only ask for a booking: you still approve in the dialog, and it never books by itself.</p></div>'+((S.ares||S.aout)?agentAnswer():'')},
settings:function(){return '<h2>Settings</h2><div class="card"><h3>Appearance</h3><button class="btn alt" data-t="dark">Dark</button> <button class="btn alt" data-t="light">Light</button></div><div class="card"><h3>About the data</h3><p class="mute"><b>Data source:</b> '+(S.src==="database"?"database ("+PROGS.length+" programmes)":"built-in list")+'.</p><p class="mute">Requirements are an illustrative snapshot with source links and a retrieval date ('+RETRIEVED+'). Published pages cannot fetch live sites, so verify on the official pages and use a Cheerio or Playwright script for live scraping. All personal data is synthetic.</p></div><div class="card"><h3>Going live with a scraper</h3><p class="mute">Run this on your own machine to read a programme page, then paste the result into the snapshot with its retrieval time.</p><pre class="code">'+"// scrape.js (Node 18+), npm i cheerio\nimport * as cheerio from \"cheerio\";\nconst url = \"https://www.tum.de/en/studies/application\";\nconst html = await (await fetch(url)).text();\nconst text = cheerio.load(html)(\"main\").text();\nconst ielts = text.match(/IELTS[^0-9]*([0-9][.][0-9])/i)?.[1];\nconsole.log({ url, retrievedAt: new Date().toISOString(), ielts });"+'</pre></div>'}
};

 document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){S.view=b.dataset.go;render()}});
 document.querySelectorAll("[data-k]").forEach(function(i){if(i.tagName==="SELECT")i.value=S.intake;i.onchange=i.oninput=function(){S[i.dataset.k]=i.value}});

 document.querySelectorAll("[data-p]").forEach(function(c){c.onchange=function(){toggle(S.sel,c.dataset.p,c.checked)}});
 document.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){document.documentElement.setAttribute("data-theme",b.dataset.t)}});
 var ar=document.getElementById("arun");if(ar)ar.onclick=runAgent;var ag=document.getElementById("agoal");if(ag)ag.oninput=function(){S.agoal=ag.value};
 var rt=document.getElementById("runtests");if(rt)rt.onclick=function(){S.tests=runTests();render()};
 var sl=document.getElementById("slot");if(sl){sl.value=S.slot;sl.onchange=function(){S.slot=sl.value}}
 var rb=document.getElementById("reqbook");if(rb)rb.onclick=requestBooking;

}
document.getElementById("sbtn").onclick=function(){var b=document.getElementById("sbox");b.classList.toggle("open");if(b.classList.contains("open"))document.getElementById("q").focus()};
document.getElementById("q").oninput=function(){S.q=this.value.toLowerCase().trim();if(S.view!=="programmes")S.view="programmes";render()};
// Agent: Claude plans and calls these page tools itself. Booking stays behind the human approval gate.
function parseAgent(t){S.aout=t;try{var s=String(t).replace(/```json|```/g,"").trim();S.ares=JSON.parse(s.slice(s.indexOf("{"),s.lastIndexOf("}")+1))}catch(e){S.ares=null}}
function agentAnswer(){
 var a=S.ares||{summary:S.aout},r=evaluate({pass:S.pass,trans:S.trans,ielts:S.ielts,have:S.have,sel:CORE}),adv={};
 (a.programmes||[]).forEach(function(p){if(p&&p.id)adv[p.id]=p.advice});
 var cnt={eligible:0,action:0,ineligible:0,uncertain:0};r.forEach(function(x){cnt[x.status]++});
 var tiles=[["eligible","Eligible","ok"],["action","Action needed","warn"],["ineligible","Ineligible","bad"],["uncertain","Uncertain","warn"]].map(function(t){return '<div class="ag-tile '+t[2]+'"><b>'+cnt[t[0]]+'</b><span>'+t[1]+'</span></div>'}).join("");
 var fix=(a.fix_first||[]).map(function(t,i){return '<li><span class="ag-n">'+(i+1)+'</span><span>'+esc(t)+'</span></li>'}).join("");
 var cards=r.map(function(x){var u=x.days<=60?"bad":x.days<=120?"warn":"ok";
  var miss=x.missing.length?x.missing.map(function(d){return '<span class="chip bad">✕ '+esc(d)+'</span>'}).join(""):'<span class="chip ok">✓ All documents on hand</span>';
  return '<div class="card ag-card"><div class="prog"><div style="display:flex;gap:10px"><div class="logo" style="background:'+x.p.col+'">'+x.p.short+'</div><div><b>'+x.p.name+'</b><div class="mute">'+x.p.deg+' · IELTS '+x.p.ielts.toFixed(1)+'</div></div></div>'+pill(x.status)+'</div><div style="margin:10px 0"><span class="pill '+u+'">'+fmt(x.p.dl)+' · '+x.days+' days left</span></div><div class="chips">'+miss+'</div>'+(x.reasons.length?'<ul class="ag-ul">'+x.reasons.map(function(t){return '<li>'+esc(t)+'</li>'}).join("")+'</ul>':'')+(adv[x.p.id]?'<div class="ag-adv">'+esc(adv[x.p.id])+'</div>':'')+'<a class="ag-link" href="'+x.p.url+'" target="_blank" rel="noopener">Official source →</a></div>'}).join("");
 var visa='<div class="card" style="margin-top:16px"><h3>Visa and embassy</h3><div class="chips">'+EMB.docs.map(function(d){return '<span class="chip ok">'+esc(d)+'</span>'}).join("")+'</div>'+(a.visa_note?'<p class="mute">'+esc(a.visa_note)+'</p>':'')+'<a class="ag-link" href="'+EMB.url+'" target="_blank" rel="noopener">Embassy page →</a></div>';
 return '<div class="ag-hero"><div class="ag-k">Agent summary</div><p style="white-space:pre-wrap">'+esc(a.summary||"")+'</p></div><div class="ag-tiles">'+tiles+'</div>'+(fix?'<div class="card"><h3>Fix these first</h3><ol class="ag-fix">'+fix+'</ol></div>':'')+'<div class="grid g2">'+cards+'</div>'+visa+(a.next_step?'<div class="ag-next"><b>Next step:</b> '+esc(a.next_step)+'</div>':'')}
async function runAgent(){
 var sample=window.claude&&window.claude.use?await window.claude.use("sample"):null;
 if(!sample){S.aout="The agent needs Claude, which is not available in this view. Open the page from its claude.ai link.";render();return}
 S.alog=[];S.aout="";S.ares=null;S.running=true;render();
 function step(tool,arg,res){S.alog.push({t:new Date().toLocaleTimeString(),tool:tool,arg:arg,res:String(res).slice(0,220)});if(S.view==="agent")render()}
 function ids(i){return i&&i.ids&&i.ids.length?i.ids:CORE}
 var tools=[
 {name:"get_student_profile",description:"Get the student's passport name, transcript name, IELTS score and documents on hand.",inputSchema:{type:"object",properties:{}},execute:async function(){var o={passport_name:S.pass||"(not entered)",transcript_name:S.trans||"(not entered)",ielts:S.ielts||"unknown",documents_on_hand:S.have,intake:S.intake};step("get_student_profile","-",JSON.stringify(o));return o}},
 {name:"list_programmes",description:"List the programme ids and names available.",inputSchema:{type:"object",properties:{}},execute:async function(){var o=PROGS.map(function(p){return{id:p.id,name:p.name}});step("list_programmes","-",o.length+" programmes");return o}},
 {name:"get_requirements",description:"Get the official requirements for one programme: required documents, IELTS, deadline and source link.",inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},execute:async function(i){var p=PROGS.filter(function(x){return x.id===i.id})[0];if(!p)throw new Error("unknown programme id");var o={name:p.name,documents:p.docs,ielts:p.ielts,deadline:p.dl,source:p.url,retrieved:RETRIEVED};step("get_requirements",i.id,JSON.stringify(o));return o}},
 {name:"evaluate_programmes",description:"Check the student against programmes (default: all 5). Returns eligible, ineligible, action needed or uncertain with reasons, missing documents, name mismatch and IELTS gaps.",inputSchema:{type:"object",properties:{ids:{type:"array",items:{type:"string"}}}},execute:async function(i){var r=evaluate({pass:S.pass,trans:S.trans,ielts:S.ielts,have:S.have,sel:ids(i)}).map(function(x){return{id:x.p.id,programme:x.p.name,status:x.status,reasons:x.reasons,deadline:x.p.dl,days_left:x.days,required_ielts:x.p.ielts,source:x.p.url}});step("evaluate_programmes",ids(i).join(","),r.map(function(x){return x.id+":"+x.status}).join(", "));return r}},
 {name:"get_embassy_info",description:"Get embassy visa and appointment details: mission, fee, refundable or not, required visa documents and the official source link.",inputSchema:{type:"object",properties:{}},execute:async function(){var o={mission:EMB.mission,appointment_fee_eur:S.fee,fee_refundable:false,visa_documents:EMB.docs,source:EMB.url,retrieved:RETRIEVED,note:"Dated snapshot. A published page cannot fetch live embassy pages, so verify on the official site."};step("get_embassy_info",EMB.mission,"fee EUR "+S.fee+" non-refundable, "+EMB.docs.length+" visa documents");return o}},
 {name:"build_checklist",description:"Build the final checklist: for each programme the missing documents, issues and deadline with source link, plus the visa documents.",inputSchema:{type:"object",properties:{ids:{type:"array",items:{type:"string"}}}},execute:async function(i){var r=evaluate({pass:S.pass,trans:S.trans,ielts:S.ielts,have:S.have,sel:ids(i)});var o={per_programme:r.map(function(x){return{programme:x.p.name,deadline:x.p.dl,missing_documents:x.missing,issues:x.reasons,source:x.p.url}}),visa_documents:EMB.docs,visa_source:EMB.url};step("build_checklist",ids(i).join(","),r.length+" programme checklists + visa list");return o}},
 {name:"request_booking",description:"Ask the human to approve a NON-REFUNDABLE embassy appointment. This only opens an approval dialog. It never books. Use only if the goal asks to book.",inputSchema:{type:"object",properties:{}},execute:async function(){var before=S.book;requestBooking();var o={state:S.book,fee_eur:S.fee,note:"Human approval dialog opened. Nothing is booked until the human clicks Approve."};step("request_booking","state was "+before,JSON.stringify(o));return o}}];
 try{var r=await sample("You are a study-abroad requirement checker agent for a student planning an MS in Germany. Never guess requirements: call the tools. Work in four stages and say which stage you are in. Stage 1, collect the details: call get_student_profile; if names, IELTS or documents are missing, say what to fill in on the Documents tab. Stage 2, plan the next steps: call evaluate_programmes and flag missing or mismatched documents. Stage 3, find the information: call get_requirements for programmes that need detail and get_embassy_info for visa and appointment details, and say these come from a dated snapshot with source links. Stage 4, take action: call build_checklist, and call request_booking only if asked. Then give a short plain-text answer per programme with its status, what to fix, the deadline and the source link, and say what to fix first. Flag a passport/transcript name mismatch and any IELTS shortfall clearly. Only call request_booking if the goal explicitly asks to book, and never say a booking was made, because only the human can approve it. Final reply format: ONLY a JSON object, with no markdown and no code fences, with these keys: summary (1 to 2 plain sentences), fix_first (array of up to 3 short action strings), programmes (array of objects with id and advice, one short sentence each, for every programme), visa_note (one sentence), next_step (one short sentence). Goal: "+S.agoal,{tools:tools,cache:false});parseAgent(r.text)}
 catch(e){S.aout="Agent stopped: "+((e&&e.message)||"unknown error")}
 S.running=false;render()}
function toggle(a,v,on){var i=a.indexOf(v);if(on&&i<0)a.push(v);if(!on&&i>-1)a.splice(i,1)}
document.getElementById("nav").onclick=function(e){var b=e.target.closest("button");if(b){S.view=b.dataset.v;render()}};
// Approval gate: requesting only moves to "awaiting approval" and shows what will change. Booking needs a click on Approve.
var BK={request:function(st){if(st.book!=="not requested")return false;st.book="awaiting approval";return true},approve:function(st){if(st.book==="awaiting approval"&&!st.receipt){st.receipt="STR"+String(Math.floor(Math.random()*9e13)+1e13);st.at=new Date();st.book="booked"}return st}};
function requestBooking(){if(!BK.request(S))return;
 var d=document.getElementById("dlg");d.innerHTML='<h3>Approve this booking?</h3><p>Destination: <b>'+esc(S.slot)+'</b></p><p>Fee: <b>€'+S.fee+'</b> <span class="pill bad">non-refundable</span></p><p class="mute">This cannot easily be undone. Only a mock receipt is created.</p><p><button class="btn" id="ap">Approve and book</button> <button class="btn alt" id="rj">Cancel</button></p>';
 d.showModal();document.getElementById("ap").onclick=function(){BK.approve(S);d.close();render();showReceipt()};
 document.getElementById("rj").onclick=function(){S.book="not requested";d.close();render()};d.onclose=function(){render()};render()}
// Verification is separate from the action: re-checks the receipt matches the approved slot
function showReceipt(){var d=document.getElementById("dlg");var at=S.at||new Date();
 d.innerHTML='<h3>Booking receipt</h3><div class="rcpt"><div class="rno"><span class="mute">Receipt no.</span><b>'+S.receipt+'</b></div><table><tr><td>Student</td><td>'+esc(S.pass)+'</td></tr><tr><td>Appointment</td><td>'+esc(S.slot)+'</td></tr><tr><td>Fee</td><td>€'+S.fee+' <span class="pill bad">non-refundable</span></td></tr><tr><td>Status</td><td>Booked (mock)</td></tr><tr><td>Issued</td><td>'+at.toLocaleString("en-GB")+'</td></tr></table></div><p class="mute">Demo receipt only. No real appointment was made.</p><p><button class="btn" id="dlpdf">Download PDF</button> <button class="btn alt" id="rcl">Close</button></p><p class="mute" id="dlmsg" role="status"></p>';
 d.showModal();document.getElementById("rcl").onclick=function(){d.close()};document.getElementById("dlpdf").onclick=downloadReceipt}
async function downloadReceipt(){var m=document.getElementById("dlmsg");
 try{var dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;var J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){m.textContent="The PDF library did not load. Check your internet connection and try again.";return}
  var p=new J({unit:"pt",format:"a4"});p.setFontSize(22);p.text("Abroadly",50,60);p.setFontSize(14);p.text("Embassy appointment booking receipt (demo)",50,86);
  p.setFontSize(12);var rows=[["Receipt no.",S.receipt],["Student",S.pass],["Appointment",S.slot],["Fee","EUR "+S.fee+" (non-refundable)"],["Status","Booked (mock)"],["Issued",(S.at||new Date()).toLocaleString("en-GB")]];
  rows.forEach(function(r,i){p.text(r[0],50,130+i*28);p.text(String(r[1]),190,130+i*28)});
  p.setFontSize(10);p.text("Demo receipt only. No real appointment was made and no OTP or CAPTCHA was bypassed.",50,130+rows.length*28+20);
  var fn="receipt-"+S.receipt+".pdf";if(dl){await dl.save({filename:fn,data:p.output("blob")})}else{p.save(fn)}m.textContent="Receipt saved."}
 catch(e){m.textContent=e&&e.code==="declined"?"Download cancelled.":"Could not save the PDF here."}}
function logv(check,expected,observed,res){S.log.unshift({t:new Date().toLocaleTimeString(),check:check,expected:expected,observed:observed,res:res})}
function vlog(){if(!S.log.length)return '';return '<div class="card scroll"><h3>Verification log</h3><table><tr><th>Time</th><th>Check</th><th>Intended</th><th>Observed</th><th>Result</th></tr>'+S.log.map(function(l){return '<tr><td>'+l.t+'</td><td>'+l.check+'</td><td>'+esc(l.expected)+'</td><td>'+esc(l.observed)+'</td><td><span class="pill '+l.res+'">'+({ok:"Verified",bad:"Failed",warn:"Pending"})[l.res]+'</span></td></tr>'}).join("")+'</table></div>'}
function verifyReceipt(){var ok=!!(S.receipt&&S.slot&&/^STR[0-9]{14}$/.test(S.receipt));S.verified=ok?"verified "+new Date().toLocaleTimeString():"receipt missing";
 logv("Slot receipt","Receipt STR + 14 digits for "+S.slot,S.receipt?S.receipt+" for "+S.slot:"no receipt",ok?"ok":"bad");
 logv("Requirement pages re-read","Live values match the snapshot dated "+RETRIEVED,"Not run: published pages cannot fetch live sites","warn");
 if(ok)S.book="verified";render()}
function runTests(){
 var base={pass:"Aarav Kumar Sharma",trans:"Aarav Kumar Sharma",ielts:"7.0",have:ALLDOCS.slice(),sel:CORE.slice()};
 var out=[];
 var r1=evaluate(base);var ok1=r1.length===5&&r1.every(function(x){return x.p.url&&x.p.docs.length});
 out.push({id:"TC1",name:"5 programmes",input:"5 programmes, IELTS 7.0, all documents",exp:"Checklist per programme with source links",act:r1.length+" checklists, "+r1.filter(function(x){return x.p.url}).length+" with source links",ev:r1.map(function(x){return x.p.short+": "+x.pct+"%"}).join(", "),pass:ok1});
 var r2=evaluate(Object.assign({},base,{trans:"Aarav K. Sharma"}));var ok2=r2.every(function(x){return x.mismatch});
 out.push({id:"TC2",name:"Name mismatch",input:"Passport “Aarav Kumar Sharma”, transcript “Aarav K. Sharma”",exp:"Mismatch flagged",act:ok2?"Mismatch flagged on all 5 programmes":"Not flagged",ev:r2[0].reasons.join("; "),pass:ok2});
 var r3=evaluate(Object.assign({},base,{ielts:"6.0"}));var t=r3.filter(function(x){return x.p.ielts===6.5});var ok3=t.every(function(x){return x.status==="ineligible"});
 out.push({id:"TC3",name:"IELTS 6.0 vs 6.5",input:"IELTS 6.0",exp:"Programme marked ineligible",act:t.length+" programmes requiring 6.5 marked ineligible; RWTH (6.0) stays "+r3.filter(function(x){return x.p.id==="rwth"})[0].status,ev:r3[0].p.short+": "+r3[0].reasons.join("; "),pass:ok3});
 var sim={book:"not requested",receipt:null};BK.request(sim);var afterReq=sim.book,rcptReq=sim.receipt;BK.approve(sim);var r1=sim.receipt;BK.approve(sim);
 var ok4=afterReq==="awaiting approval"&&rcptReq===null&&!!r1&&sim.receipt===r1&&sim.book==="booked";
 out.push({id:"TC4",name:"Non-refundable fee",input:"Slot "+S.slot+", fee €"+S.fee+" non-refundable",exp:"Approval requested first",act:"After request: "+afterReq+", receipt "+(rcptReq||"none")+". After approval: "+sim.book+", "+r1,ev:"Runs the same request and approve functions the buttons use; a second approve returned the same receipt ("+(sim.receipt===r1?"no duplicate":"DUPLICATE")+")",pass:ok4});
 return out}
render();
// Programme data: loads from the artifact database when available, otherwise keeps the built-in list above
(async function(){try{var db=window.claude&&window.claude.use?await window.claude.use("db"):null;if(!db)return;
 var snap=await db.collection("programmes").orderBy("order").get();if(snap.empty)return;
 var rows=snap.docs.map(function(d){return d.data()}).filter(function(p){return p&&p.id&&p.name&&p.docs&&p.dl&&p.ielts});if(!rows.length)return;
 var all=S.sel.length===PROGS.length;PROGS.length=0;rows.forEach(function(p){PROGS.push(p)});
 var ids=PROGS.map(function(p){return p.id});S.sel=all?ids:S.sel.filter(function(i){return ids.indexOf(i)>-1});S.src="database";render()}catch(e){}})();
